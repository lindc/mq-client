# Kotlin
kotlin.code.style=official

# Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
# The Java 25 toolchain is auto-detected from JAVA_HOME / PATH / standard install
# locations. Only override this in your own user-level gradle.properties
# (GRADLE_USER_HOME/gradle.properties), never with a path committed here:
#   org.gradle.java.installations.paths=/path/to/jdk-25
org.gradle.java.installations.auto-download=false
# Disabled for the first build to avoid plugin compatibility surprises.
org.gradle.configuration-cache=false

# Kotlin daemon
kotlin.daemon.jvmargs=-Xmx3072M

# Android SDK (kept for later multiplatform targets): use the ANDROID_HOME /
# ANDROID_SDK_ROOT environment variable, or a git-ignored local.properties.
# Do not commit a machine-specific sdk.dir here.
