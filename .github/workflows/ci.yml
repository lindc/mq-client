name: CI

# 门槛：分层架构检查 + 编译全部模块 + 跑全部单元测试 + i18n 键引用检查。
#
# 唯一的失败源应该是代码问题，不是环境问题 —— 因此：
#   - 真机测试（*LiveTest / *DiagTest）在没有 ~/.mqclient/config.toml 时自行打印 SKIP
#     并通过，所以 CI 里没有 broker 也不会红；
#   - JDK 版本由 setup-java 提供，gradle.properties 里 auto-download=false 与之配合
#     （工具链只从 JAVA_HOME 解析，不需要联网下载 JDK）。
#
# 命令本身放在 scripts/verify.sh 里，本地与 CI 共用一份 —— 避免「本地过、CI 挂」。

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify (architecture + assemble + jvmTest + i18n)
        # 用 `bash` 而不是 `./scripts/verify.sh`：执行位虽然已提交为 100755，但检出后
        # 是否保留取决于平台（Windows 检出、zip 分发都会丢）。少了它，这一行会以
        # exit 126 失败，而且看起来像代码问题 —— 门禁本身不该成为失败源。
        run: bash ./scripts/verify.sh

      # 失败时把测试报告捞出来 —— 否则只能看到「某模块 exit 1」，还得本地复现。
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/jvmTest/**
            **/build/test-results/jvmTest/*.xml
          if-no-files-found: ignore
          retention-days: 7
