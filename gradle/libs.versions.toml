[versions]
kotlin = "2.4.10"
composeMultiplatform = "1.12.0"
materialKolor = "5.0.1"
# Material 3 adaptive navigation (NavigationSuiteScaffold). Pinned to the same
# build the Compose plugin resolves for material3 (1.12.0-alpha03), not to the
# plugin accessor's older 1.9.0 default — mixing them compiles against one
# material3 and runs against another.
material3Adaptive = "1.12.0-alpha03"
# Nucleus framework version used by the custom window chrome. Pinned to what the
# old compose-macos-ui 1.1.0 dependency used to pull in transitively.
nucleus = "2.5.2"

[libraries]
# Compose Multiplatform
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }

# Nucleus windowing framework (Tao backend) — powers the custom DecoratedWindow
# chrome (previously reached via the now-removed compose-macos-ui dependency).
nucleus-core-runtime = { module = "dev.nucleusframework:nucleus.core-runtime", version.ref = "nucleus" }
nucleus-window = { module = "dev.nucleusframework:nucleus.decorated-window-tao", version.ref = "nucleus" }
nucleus-application = { module = "dev.nucleusframework:nucleus.nucleus-application", version.ref = "nucleus" }

# Material You dynamic color for Compose Multiplatform
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }

# Material 3 adaptive navigation: switches the sidebar between a drawer and a
# rail based on the window width class.
material3-adaptive-navigation-suite = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "material3Adaptive" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
