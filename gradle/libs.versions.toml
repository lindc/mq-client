[versions]
kotlin = "2.4.10"
composeMultiplatform = "1.12.0"
materialKolor = "5.0.1"
# Nucleus framework version used by the custom window chrome. Pinned to what the
# old compose-macos-ui 1.1.0 dependency used to pull in transitively.
nucleus = "2.5.2"
kotlinxSerialization = "1.8.0"
okio = "3.15.0"
sqldelight = "2.3.2"
# Coroutines — 固定在 sqldelight 传递解析出的版本上，不主动升级。
kotlinxCoroutines = "1.10.2"
# Ktor — HTTP/SSE client for the AI adapter module (:openai-service).
ktor = "3.2.3"

[libraries]
# Compose Multiplatform
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }

# Nucleus windowing framework (Tao backend) — powers the custom DecoratedWindow
# chrome (previously reached via the now-removed compose-macos-ui dependency).
nucleus-core-runtime = { module = "dev.nucleusframework:nucleus.core-runtime", version.ref = "nucleus" }
nucleus-window = { module = "dev.nucleusframework:nucleus.decorated-window-tao", version.ref = "nucleus" }
nucleus-application = { module = "dev.nucleusframework:nucleus.nucleus-application", version.ref = "nucleus" }

# Material You dynamic color for Compose Multiplatform
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }

# JSON serialization for the AI panel's settings / message-history files.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# File I/O for ConfigManager (atomic writes).
okio = { module = "com.squareup.okio:okio-jvm", version.ref = "okio" }

# Coroutines — app-core 的事件总线把 CoroutineScope / Job / SharedFlow 放在公开 API
# 上, 所以由 app-core 用 api 暴露 (见 app-core/build.gradle.kts).
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

# Ktor Client — HTTP + SSE for the AI adapter module (:openai-service). Multiplatform
# artifacts (CIO engine included), so the adapter layer lives in commonMain.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# SQLDelight: typed SQLite persistence for runtime history data.
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
