[versions]
kotlin = "2.4.10"
composeMultiplatform = "1.12.0"
materialKolor = "5.0.1"
# Nucleus framework version used by the custom window chrome. Pinned to what the
# old compose-macos-ui 1.1.0 dependency used to pull in transitively.
nucleus = "2.5.2"
kotlinxSerialization = "1.8.0"
okio = "3.15.0"
sqldelight = "2.3.2"
# Coroutines — 固定在 sqldelight 传递解析出的版本上，不主动升级。
kotlinxCoroutines = "1.10.2"
# Ktor — HTTP/SSE client for the AI adapter module (:openai-service).
ktor = "3.2.3"
# Ktoml — TOML 编解码，配置文件 config.toml 的读写。
ktoml = "0.7.1"
# Kuiver — Compose Multiplatform UI 组件库。
kuiver = "0.4.2"
# FileKit — 本地文件选择对话框（JVM 端：Windows 走 JNA 原生 IFileDialog）。
# 注意选择器 API 在 dialogs 模块，core 只是它的传递依赖（PlatformFile 抽象所在）。
filekit = "0.16.0"
# UUIDv7 生成（时间有序，适合做数据库主键与按时间排序）。JVM-only。
uuidCreator = "5.3.3"

[libraries]
# Compose Multiplatform
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
# Painter（ModuleIcon SPI 的签名类型）所在的最小 ui 构件；app-core 不引 material/foundation。
compose-ui-graphics = { module = "org.jetbrains.compose.ui:ui-graphics", version.ref = "composeMultiplatform" }

# Nucleus windowing framework (Tao backend) — powers the custom DecoratedWindow
# chrome (previously reached via the now-removed compose-macos-ui dependency).
nucleus-core-runtime = { module = "dev.nucleusframework:nucleus.core-runtime", version.ref = "nucleus" }
nucleus-window = { module = "dev.nucleusframework:nucleus.decorated-window-tao", version.ref = "nucleus" }
nucleus-application = { module = "dev.nucleusframework:nucleus.nucleus-application", version.ref = "nucleus" }

# Material You dynamic color for Compose Multiplatform
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }

# JSON serialization for the AI panel's settings / message-history files.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# File I/O for ConfigManager (atomic writes).
okio = { module = "com.squareup.okio:okio-jvm", version.ref = "okio" }

# Coroutines — app-core 的事件总线把 CoroutineScope / Job / SharedFlow 放在公开 API
# 上, 所以由 app-core 用 api 暴露 (见 app-core/build.gradle.kts).
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

# Ktor Client — HTTP + SSE for the AI adapter module (:openai-service). Multiplatform
# artifacts (CIO engine included), so the adapter layer lives in commonMain.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# SQLDelight: typed SQLite persistence for runtime history data.
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }

# Ktoml: TOML codec for ConfigManager (config.toml). 0.7.x 拆成了 core / source /
# file 三个模块：Toml 编解码 API 在 core，file 只提供文件读写助手（core 是它的
# runtime 依赖，编译期要单独引）。
ktoml-core = { module = "com.akuleshov7:ktoml-core-jvm", version.ref = "ktoml" }
ktoml-file = { module = "com.akuleshov7:ktoml-file-jvm", version.ref = "ktoml" }

# uuid-creator: UUIDv7（时间有序）生成，连接 id 的唯一来源（见 Connection.kt 的 newConnectionId）。
uuid-creator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuidCreator" }

# Kuiver — Compose Multiplatform UI 组件库.
kuiver = { module = "io.github.justdeko:kuiver", version.ref = "kuiver" }

# FileKit dialogs: 文件选择器（ibm-mq-ui 的证书路径选择）。传 filekit-core。
filekit-dialogs = { module = "io.github.vinceglb:filekit-dialogs", version.ref = "filekit" }
# FileKit Compose 文件选择器（命令控制台的「打开文件」/「导出结果」按钮）。传 filekit-dialogs / filekit-core。
filekit-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
