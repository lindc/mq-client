distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Official Gradle 9.7.1 distribution. Downloaded once per machine and cached
# under GRADLE_USER_HOME, so no machine-specific paths are needed here.
# If you need to stay offline, point this at a local archive instead, e.g.:
#   distributionUrl=file:///C:/Development/build/gradle-dist.zip
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
